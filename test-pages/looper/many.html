<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looper - Many Items</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="looper-container" data-testid="looper-many" data-moonwalk-run="loop">
    <div class="looper-wrapper" data-looper-container>
      <div data-looper>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">1</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">2</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">3</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">4</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">5</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">6</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">7</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">8</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">9</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">10</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">11</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">12</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">13</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">14</div>
        <div data-looper-item style="background: linear-gradient(135deg, #e17055 0%, #d63031 100%);">15</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initLooper } from './shared.js'
    initLooper()
  </script>
</body>
</html>

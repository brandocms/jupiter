<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jupiter Lightbox Test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #333;
        color: white;
        padding: 1rem;
      }
      section {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }
      .gallery-item {
        cursor: pointer;
        overflow: hidden;
        border-radius: 8px;
        transition: transform 0.2s;
      }
      .gallery-item:hover {
        transform: scale(1.05);
      }
      .gallery-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Jupiter Lightbox Test</h1>
    </header>
    <section>
      <h2>Image Gallery</h2>
      <p>Click any image to open in lightbox</p>
      <div class="gallery" data-lightbox-gallery="gallery1">
        <div class="gallery-item" data-lightbox-trigger>
          <img src="https://picsum.photos/400/300?random=1" alt="Image 1" data-lightbox-image />
        </div>
        <div class="gallery-item" data-lightbox-trigger>
          <img src="https://picsum.photos/400/300?random=2" alt="Image 2" data-lightbox-image />
        </div>
        <div class="gallery-item" data-lightbox-trigger>
          <img src="https://picsum.photos/400/300?random=3" alt="Image 3" data-lightbox-image />
        </div>
        <div class="gallery-item" data-lightbox-trigger>
          <img src="https://picsum.photos/400/300?random=4" alt="Image 4" data-lightbox-image />
        </div>
        <div class="gallery-item" data-lightbox-trigger>
          <img src="https://picsum.photos/400/300?random=5" alt="Image 5" data-lightbox-image />
        </div>
        <div class="gallery-item" data-lightbox-trigger>
          <img src="https://picsum.photos/400/300?random=6" alt="Image 6" data-lightbox-image />
        </div>
      </div>
    </section>
    <script type="module">
      import { Application, Lightbox } from "../src/index.js";
      const app = new Application({ respectReducedMotion: false });
      new Lightbox(app, { el: "[data-lightbox-gallery]" });
      app.initialize();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jupiter SmartVideo Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        padding: 2rem;
      }

      h2 {
        margin: 1rem 0;
      }

      .spacer {
        height: 2500px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
        margin: 2rem 0;
      }

      /* This page's own layout */
      [data-smart-video] {
        max-width: 640px;

        video {
          background-color: #000;
        }
      }

      /*
       * Brando's installer ships these rules for the wrappers, in
       * priv/templates/brando.install/assets/frontend/css/app.css; keep them the same.
       */
      .video-wrapper {
        &.video-embed {
          padding-bottom: calc(var(--aspect-ratio, .5625) * 100%);

          video {
            top: 0;
            width: 100%;
            position: absolute;
            z-index: 1;
          }

          iframe {
            top: 0;
            height: 100%;
            width: 100%;
            position: absolute;
            z-index: 3;
          }
        }

        video {
          width: 100%;
        }
      }

      /** Smart video **/
      [data-smart-video] {
        position: relative;
        display: grid;
        grid-template-columns: 100%;
        opacity: 0;
        visibility: hidden;

        /* SmartVideo sets it when it gives the video its source */
        &[data-revealed] {
          opacity: 1;
          visibility: visible;
        }

        /* The video, its cover and play button share the first row, so the cover
           and button sit on the video and a caption goes below it */
        video,
        noscript,
        [data-cover],
        .video-play-button-wrapper {
          grid-area: 1 / 1 / 2 / 2;
        }

        figcaption {
          grid-row: 2;
        }

        /* Over the video until it plays; a click goes through to the video */
        [data-cover] {
          pointer-events: none;
          position: absolute;
          top: 0;
          left: 0;
          z-index: 2;
          height: 100%;
          width: 100%;

          figure {
            height: 100%;
            width: 100%;

            picture {
              height: 100%;
              width: 100%;

              img {
                height: 100%;
                width: 100%;
                object-fit: cover;
              }
            }
          }
        }

        video {
          width: 100%;
        }

        .video-play-button-wrapper {
          position: absolute;
          top: 50%;
          left: 50%;
          z-index: 3;
          transform: translate(-50%, -50%);
        }

        /* Native controls are the video's own play button, and a cover would hide them */
        &[data-controls] [data-cover] {
          display: none;
        }

        &[data-playing] {
          [data-cover] {
            visibility: hidden;
          }

          .video-play-button-wrapper {
            opacity: 0;
            pointer-events: none;
          }
        }
      }

      .no-js [data-smart-video] {
        opacity: 1 !important;
        visibility: visible !important;
      }
    </style>
  </head>
  <body>
    <h2>Autoplay, lazy</h2>
    <div
      class="video-wrapper video-file"
      data-smart-video
      data-orientation="landscape"
      data-preload="videos/clip.webm?autoplay"
      data-src="videos/clip.webm?autoplay"
      data-autoplay
      style="--aspect-ratio: 0.5625; --aspect-ratio-division: 320/180;"
      data-testid="autoplay"
    >
      <video
        width="320"
        height="180"
        alt=""
        tabindex="0"
        preload="auto"
        autoplay
        muted
        loop
        playsinline
        data-video
        data-src="videos/clip.webm?autoplay"
      ></video>
      <noscript>
        <video width="320" height="180" preload="metadata" autoplay muted loop playsinline src="videos/clip.webm?autoplay"></video>
      </noscript>
    </div>

    <div class="spacer"><p>Scroll down for the lazy video</p></div>

    <h2>Lazy</h2>
    <div
      class="video-wrapper video-file"
      data-smart-video
      data-orientation="landscape"
      data-preload="videos/clip.webm?lazy"
      data-src="videos/clip.webm?lazy"
      style="--aspect-ratio: 0.5625; --aspect-ratio-division: 320/180;"
      data-testid="lazy"
    >
      <video
        width="320"
        height="180"
        alt=""
        tabindex="0"
        preload="auto"
        loop
        playsinline
        data-video
        data-src="videos/clip.webm?lazy"
      ></video>
      <noscript>
        <video width="320" height="180" preload="metadata" loop playsinline src="videos/clip.webm?lazy"></video>
      </noscript>
    </div>

    <div class="spacer"><p>Scroll down for the video that is not lazy</p></div>

    <h2>Not lazy</h2>
    <div
      class="video-wrapper video-file"
      data-smart-video
      data-orientation="landscape"
      data-src="videos/clip.webm?eager"
      style="--aspect-ratio: 0.5625; --aspect-ratio-division: 320/180;"
      data-testid="eager"
    >
      <video
        width="320"
        height="180"
        alt=""
        tabindex="0"
        preload="auto"
        loop
        playsinline
        data-video
        src="videos/clip.webm?eager"
      ></video>
    </div>

    <div class="spacer"><p>Scroll down for the video with a play button</p></div>

    <h2>Play button</h2>
    <div
      class="video-wrapper video-file"
      data-smart-video
      data-orientation="landscape"
      data-preload="videos/clip.webm?button"
      data-src="videos/clip.webm?button"
      style="--aspect-ratio: 0.5625; --aspect-ratio-division: 320/180;"
      data-testid="button"
    >
      <video
        width="320"
        height="180"
        alt=""
        tabindex="0"
        preload="auto"
        loop
        playsinline
        data-video
        data-src="videos/clip.webm?button"
      ></video>
      <noscript>
        <video width="320" height="180" preload="metadata" loop playsinline src="videos/clip.webm?button"></video>
      </noscript>
      <div class="video-play-button-wrapper">
        <button class="video-play-button">
          <div class="video-play-button-inside">▶︎</div>
        </button>
      </div>
    </div>

    <div class="spacer"><p>Scroll down for the video with a cover</p></div>

    <h2>Cover and play button</h2>
    <div
      class="video-wrapper video-file"
      data-smart-video
      data-orientation="landscape"
      data-preload="videos/clip.webm?cover"
      data-src="videos/clip.webm?cover"
      style="--aspect-ratio: 0.5625; --aspect-ratio-division: 320/180;"
      data-testid="cover"
    >
      <video
        width="320"
        height="180"
        alt=""
        tabindex="0"
        preload="auto"
        loop
        playsinline
        data-video
        data-src="videos/clip.webm?cover"
      ></video>
      <noscript>
        <video width="320" height="180" preload="metadata" loop playsinline src="videos/clip.webm?cover"></video>
      </noscript>
      <div class="video-play-button-wrapper">
        <button class="video-play-button">
          <div class="video-play-button-inside">▶︎</div>
        </button>
      </div>
      <div data-cover aria-hidden="true">
        <figure>
          <picture>
            <img width="320" height="180" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27320%27%20height%3D%27180%27%20style%3D%27background%3A%23336%27%2F%3E" />
          </picture>
        </figure>
      </div>
      <figcaption>A caption under the video</figcaption>
    </div>

    <div class="spacer"><p>Scroll down for the HLS stream</p></div>

    <h2>HLS stream, play button</h2>
    <div
      class="video-wrapper video-file"
      data-smart-video
      data-orientation="landscape"
      data-preload="videos/hls/clip.m3u8"
      data-src="videos/hls/clip.m3u8"
      style="--aspect-ratio: 0.5625; --aspect-ratio-division: 160/90;"
      data-testid="hls"
    >
      <video
        width="160"
        height="90"
        alt=""
        tabindex="0"
        preload="auto"
        loop
        playsinline
        data-video
        data-src="videos/hls/clip.m3u8"
      ></video>
      <noscript>
        <video width="160" height="90" preload="metadata" loop playsinline src="videos/hls/clip.m3u8"></video>
      </noscript>
      <div class="video-play-button-wrapper">
        <button class="video-play-button">
          <div class="video-play-button-inside">▶︎</div>
        </button>
      </div>
    </div>

    <script type="module">
      import { Application, Events, SmartVideo } from '../src/index.js'

      document.addEventListener('DOMContentLoaded', () => {
        const app = new Application({ respectReducedMotion: false })

        app.registerCallback(Events.APPLICATION_READY, () => {
          app.smartVideo = new SmartVideo(app)
          window.__smartVideo = app.smartVideo
        })

        app.initialize()
      })
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jupiter Lazyload Test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        padding: 2rem;
        margin: 0;
      }

      .spacer {
        height: 100vh;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f0f0;
      }

      .image-container {
        margin-bottom: 2rem;
      }

      figure {
        margin: 0 0 2rem 0;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      [data-ll-blurred] {
        opacity: 0.5;
        filter: blur(5px);
        transition:
          opacity 0.3s,
          filter 0.3s;
      }

      [data-ll-loaded] {
        opacity: 1;
        filter: none;
      }
    </style>
  </head>
  <body>
    <h1>Jupiter Lazyload Test</h1>

    <!-- First image (should load immediately) -->
    <figure
      data-orientation="landscape"
      data-placeholder="dominant_color"
      data-testid="landscape-figure"
    >
      <picture
        data-ll-srcset
        data-orientation="landscape"
        style="background-color: #f0f0f0"
        data-testid="landscape-picture"
      >
        <source
          data-srcset="images/blue-400x300.svg 400w, images/blue-700x525.svg 700w"
          type="image/svg+xml"
        />
        <img
          alt="Random landscape image"
          data-ll-placeholder
          data-ll-srcset-image
          data-sizes="auto"
          data-src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%271400%27%20height%3D%271050%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
          data-srcset="images/blue-400x300.svg 400w, images/blue-700x525.svg 700w"
          height="1050"
          src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%271400%27%20height%3D%271050%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
          style="object-position: 50% 50%"
          width="1400"
          data-testid="landscape-image"
        />
        <noscript
          ><img src="images/blue-400x300.svg"
        /></noscript>
      </picture>
    </figure>

    <div class="spacer">
      <p>Scroll down to see more lazy loaded images</p>
    </div>

    <!-- Second image (portrait) -->
    <figure
      data-orientation="portrait"
      data-placeholder="dominant_color"
      data-testid="portrait-figure"
    >
      <picture
        data-ll-srcset
        data-orientation="portrait"
        style="background-color: #f0f0f0"
        data-testid="portrait-picture"
      >
        <source
          data-srcset="images/red-400x600.svg 400w, images/red-700x1050.svg 700w"
          type="image/svg+xml"
        />
        <img
          alt="Random portrait image"
          data-ll-placeholder
          data-ll-srcset-image
          data-sizes="auto"
          data-src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%271400%27%20height%3D%272100%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
          data-srcset="images/red-400x600.svg 400w, images/red-700x1050.svg 700w"
          height="2100"
          src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%271400%27%20height%3D%272100%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
          style="object-position: 50% 50%"
          width="1400"
          data-testid="portrait-image"
        />
        <noscript
          ><img src="images/red-400x600.svg"
        /></noscript>
      </picture>
    </figure>

    <!-- Third image -->
    <figure
      data-orientation="landscape"
      data-placeholder="dominant_color"
      data-testid="third-figure"
    >
      <picture
        data-ll-srcset
        data-orientation="landscape"
        style="background-color: #f0f0f0"
        data-testid="third-picture"
      >
        <source
          data-srcset="images/green-400x300.svg 400w, images/green-700x525.svg 700w"
          type="image/svg+xml"
        />
        <img
          alt="Another random landscape image"
          data-ll-placeholder
          data-ll-srcset-image
          data-sizes="auto"
          data-src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%271400%27%20height%3D%271050%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
          data-srcset="images/green-400x300.svg 400w, images/green-700x525.svg 700w"
          height="1050"
          src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%271400%27%20height%3D%271050%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
          style="object-position: 50% 50%"
          width="1400"
          data-testid="third-image"
        />
        <noscript
          ><img src="images/green-400x300.svg"
        /></noscript>
      </picture>
    </figure>

    <!-- Legacy data-ll-image element -->
    <div class="spacer">
      <p>Scroll down to see a legacy data-ll-image and lazyload section</p>
    </div>

    <img
      data-ll-image
      data-src="images/blue-400x300.svg"
      src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27400%27%20height%3D%27300%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
      width="400"
      height="300"
      alt="Legacy lazyload image"
      data-testid="legacy-image"
    />

    <!-- Container for forceLoad testing -->
    <div data-testid="force-load-container" style="display:none">
      <picture data-ll-srcset data-testid="force-load-picture">
        <source
          data-srcset="images/green-400x300.svg 400w"
          type="image/svg+xml"
        />
        <img
          data-ll-placeholder
          data-ll-srcset-image
          data-src="images/green-400x300.svg"
          src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27400%27%20height%3D%27300%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
          width="400"
          height="300"
          alt="Force loaded image"
          data-testid="force-load-image"
        />
      </picture>
    </div>

    <!-- Lazyload section example -->
    <div class="spacer">
      <p>Scroll down to see a lazyload section</p>
    </div>

    <div
      data-lazyload-section
      class="image-container"
      data-testid="lazyload-section"
    >
      <h2>Lazyload Section</h2>
      <p>
        All images in this section will load when the section enters the
        viewport
      </p>

      <figure data-orientation="landscape" data-testid="section-figure">
        <picture
          data-ll-srcset
          data-orientation="landscape"
          data-testid="section-picture"
        >
          <source
            data-srcset="images/orange-400x300.svg 400w, images/orange-700x525.svg 700w"
            type="image/svg+xml"
          />
          <img
            alt="Section image"
            data-ll-placeholder
            data-ll-srcset-image
            data-sizes="auto"
            data-src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27700%27%20height%3D%27525%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
            data-srcset="images/orange-400x300.svg 400w, images/orange-700x525.svg 700w"
            height="525"
            src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27700%27%20height%3D%27525%27%20style%3D%27background%3Argba%280%2C0%2C0%2C0%29%27%2F%3E"
            width="700"
            data-testid="section-image"
          />
        </picture>
      </figure>
    </div>

    <script type="module">
      import { Application, Lazyload, Events } from "../src/index.js";

      document.addEventListener("DOMContentLoaded", () => {
        // Initialize Application
        const app = new Application({
          respectReducedMotion: false,
          breakpointConfig: {
            breakpoints: [
              "iphone",
              "mobile",
              "ipad_portrait",
              "ipad_landscape",
              "desktop_md",
              "desktop_lg",
              "desktop_xl",
            ],
          },
        });

        // Register the Lazyload module
        app.registerCallback(Events.APPLICATION_READY, () => {
          app.lazyload = new Lazyload(app, {
            useNativeLazyloadIfAvailable: false, // Force IntersectionObserver for testing
          });
          window.__lazyload = app.lazyload;
        });

        // Start the application
        app.initialize();
      });
    </script>
  </body>
</html>

name: Node.js Package

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    outputs:
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    timeout-minutes: 60
    # Playwright 1.58 ships Chromium for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: "yarn"
      - name: Verify release version
        id: version
        run: |
          tag=$(node scripts/release-tag.cjs "$GITHUB_REF_NAME")
          echo "npm_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify declarations, package exports and demo builds
        run: |
          yarn types
          yarn verify:package
          yarn vite:build
          git diff --exit-code -- types test-pages/dist
          test -z "$(git ls-files --others --exclude-standard -- types test-pages/dist)"
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
      - name: Run Playwright tests
        run: yarn test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  publish-npm:
    permissions:
      contents: read
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        run: npm publish --access=public --tag ${{ needs.build.outputs.npm_tag }}
